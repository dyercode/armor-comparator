name: CI
on:
  pull_request:
  push:
jobs:
  test:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: cachix/install-nix-action@v31
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run checks
        run: nix develop --command bash -c "dev check"
